name: social-poster image

# Publishes the social-poster container to GHCR for the Pi's compose stack.
#
# Tags are prefixed `social-poster-v` so image releases don't collide with any
# other versioning in this repo. Push `social-poster-v1.0.0` to cut a release
# (`npm run release` in social-poster/ does it); pushes to main refresh `edge`.
on:
  push:
    branches: [main]
    tags: ["social-poster-v*"]
    paths:
      - "social-poster/**"
      - ".github/workflows/social-poster-image.yml"
  pull_request:
    paths:
      - "social-poster/**"
      - ".github/workflows/social-poster-image.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/social-poster

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # The Pi is arm64 and these runners are amd64. Emulating the whole build
      # is slow — the Vite build and pip install both run under QEMU — but it
      # keeps the toolchain to one action instead of a cross-compile setup.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Skipped on pull_request: forks have no write access, and a PR should
      # verify the image builds without publishing it.
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=match,pattern=social-poster-v(.*),group=1
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/social-poster-v') }}

      - uses: docker/build-push-action@v6
        with:
          context: social-poster
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
